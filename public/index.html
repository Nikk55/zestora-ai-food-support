<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Zestora AI - Food Support</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f3f5f4;
      min-height: 100vh;
      color: #17201c;
    }

    .app {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .chat-container {
      width: 100%;
      max-width: 1000px;

      height: 90vh;
      max-height: 850px;

      background: white;

      border: 1px solid #e4e8e6;
      border-radius: 24px;

      overflow: hidden;

      display: flex;
      flex-direction: column;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.08);
    }

    /* ================= HEADER ================= */

    .header {
      height: 78px;

      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #edf0ee;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;

      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #17201c;
      color: white;

      font-size: 21px;
      font-weight: 700;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
    }

    .status {
      margin-top: 4px;

      display: flex;
      align-items: center;
      gap: 6px;

      font-size: 12px;
      color: #737b77;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      background: #22c55e;

      border-radius: 50%;
    }

    .clear-btn {
      width: 40px;
      height: 40px;

      border: none;
      border-radius: 12px;

      background: #f4f6f5;

      cursor: pointer;

      font-size: 17px;
    }

    .clear-btn:hover {
      background: #e9edeb;
    }

    /* ================= CHAT AREA ================= */

    .chat-area {
      flex: 1;

      overflow-y: auto;

      padding: 30px;

      background: #fafbfb;
    }

    /* ================= WELCOME ================= */

    .welcome {
      min-height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .welcome-icon {
      width: 78px;
      height: 78px;

      border-radius: 24px;

      background: #17201c;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 34px;

      margin-bottom: 18px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #747c78;
      margin-bottom: 28px;
    }

    .quick-actions {
      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 10px;
    }

    .quick-btn {
      padding: 11px 16px;

      background: white;

      border: 1px solid #dfe4e2;

      border-radius: 12px;

      cursor: pointer;

      font-size: 14px;

      transition: 0.2s;
    }

    .quick-btn:hover {
      border-color: #17201c;

      transform: translateY(-1px);
    }

    /* ================= MESSAGE ================= */

    .message-row {
      display: flex;

      align-items: flex-end;

      gap: 10px;

      margin-bottom: 18px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;

      flex-shrink: 0;

      border-radius: 11px;

      background: #17201c;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 12px;
      font-weight: 700;
    }

    .user-avatar {
      width: 34px;
      height: 34px;

      flex-shrink: 0;

      border-radius: 11px;

      background: #e7ebe9;
      color: #39423e;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 11px;
      font-weight: 700;
    }

    .message {
      max-width: 70%;

      padding: 13px 16px;

      border-radius: 17px;

      font-size: 14px;

      line-height: 1.55;

      white-space: pre-wrap;
    }

    .assistant-message {
      background: white;

      border: 1px solid #e3e8e5;

      border-bottom-left-radius: 5px;
    }

    .user-message {
      background: #17201c;

      color: white;

      border-bottom-right-radius: 5px;
    }

    /* ================= TYPING ================= */

    .typing {
      display: flex;

      gap: 5px;

      padding: 15px 17px;

      background: white;

      border: 1px solid #e3e8e5;

      border-radius: 17px;
    }

    .typing span {
      width: 6px;
      height: 6px;

      background: #9ca3af;

      border-radius: 50%;

      animation: typing 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    /* ================= INPUT ================= */

    .input-section {
      padding: 16px 22px 14px;

      background: white;

      border-top: 1px solid #edf0ee;
    }

    .input-box {
      display: flex;

      align-items: flex-end;

      gap: 10px;

      padding: 7px 7px 7px 15px;

      border: 1px solid #dfe4e2;

      border-radius: 17px;

      background: #fafbfb;
    }

    .input-box:focus-within {
      border-color: #9ba39f;
    }

    #messageInput {
      flex: 1;

      border: none;
      outline: none;

      resize: none;

      background: transparent;

      font-size: 14px;

      line-height: 1.5;

      padding: 8px 0;

      max-height: 100px;
    }

    #sendBtn {
      width: 42px;
      height: 42px;

      border: none;

      border-radius: 12px;

      background: #17201c;
      color: white;

      cursor: pointer;

      font-size: 18px;
    }

    #sendBtn:disabled {
      opacity: 0.35;

      cursor: not-allowed;
    }

    .footer-text {
      text-align: center;

      margin-top: 8px;

      font-size: 10px;

      color: #9ca3af;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 650px) {
      .app {
        padding: 0;
      }

      .chat-container {
        height: 100vh;
        max-height: none;

        border-radius: 0;
      }

      .chat-area {
        padding: 18px;
      }

      .message {
        max-width: 82%;
      }

      .welcome h1 {
        font-size: 24px;
      }

      .quick-actions {
        flex-direction: column;
        width: 100%;
      }

      .quick-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="chat-container">

      <!-- HEADER -->
      <header class="header">

        <div class="brand">

          <div class="logo">
            Z
          </div>

          <div>

            <div class="brand-name">
              Zestora AI
            </div>

            <div class="status">

              <span class="status-dot"></span>

              Online • Food Support

            </div>

          </div>

        </div>

        <button
          class="clear-btn"
          id="clearBtn"
          title="Clear conversation"
        >
          🗑️
        </button>

      </header>


      <!-- CHAT -->
      <main
        class="chat-area"
        id="chatArea"
      >

        <!-- WELCOME SCREEN -->

        <div
          class="welcome"
          id="welcome"
        >

          <div class="welcome-icon">
            🤖
          </div>

          <h1>
            Welcome to Zestora AI
          </h1>

          <p>
            Your smart food-ordering support assistant.
          </p>

          <div class="quick-actions">

            <button
              class="quick-btn"
              onclick="quickMessage('I want to track my food order.')"
            >
              📦 Track Order
            </button>

            <button
              class="quick-btn"
              onclick="quickMessage('I want to request a refund for my order.')"
            >
              💰 Request Refund
            </button>

            <button
              class="quick-btn"
              onclick="quickMessage('My order has not been delivered yet.')"
            >
              🚚 Delivery Issue
            </button>

          </div>

        </div>

        <div id="messages"></div>

      </main>


      <!-- INPUT -->
      <footer class="input-section">

        <div class="input-box">

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Ask about your order..."
          ></textarea>

          <button
            id="sendBtn"
            disabled
          >
            ➤
          </button>

        </div>

        <div class="footer-text">
          Zestora AI can make mistakes. Please verify important order details.
        </div>

      </footer>

    </div>

  </div>


  <script>

    /*
      ==========================================
      BACKEND CONNECTION
      ==========================================
    */

    const CHAT_API =
      "/api/chat";

    const CLEAR_API =
      "/api";

    /*
      ==========================================
      ELEMENTS
      ==========================================
    */

    const input =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const messages =
      document.getElementById("messages");

    const chatArea =
      document.getElementById("chatArea");

    const welcome =
      document.getElementById("welcome");

    const clearBtn =
      document.getElementById("clearBtn");


    /*
      ==========================================
      STATE
      ==========================================
    */

    let loading = false;


    /*
      ==========================================
      ENABLE / DISABLE SEND BUTTON
      ==========================================
    */

    input.addEventListener("input", () => {

      sendBtn.disabled =
        !input.value.trim() || loading;

    });


    /*
      ==========================================
      ENTER TO SEND
      ==========================================
    */

    input.addEventListener("keydown", (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    });


    /*
      ==========================================
      SEND BUTTON
      ==========================================
    */

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /*
      ==========================================
      QUICK MESSAGE
      ==========================================
    */

    function quickMessage(text) {

      input.value = text;

      sendMessage();

    }


    /*
      ==========================================
      ADD USER MESSAGE
      ==========================================
    */

    function addUserMessage(text) {

      const row =
        document.createElement("div");

      row.className =
        "message-row user";


      const message =
        document.createElement("div");

      message.className =
        "message user-message";

      message.textContent =
        text;


      const avatar =
        document.createElement("div");

      avatar.className =
        "user-avatar";

      avatar.textContent =
        "You";


      row.appendChild(message);

      row.appendChild(avatar);

      messages.appendChild(row);

      scrollToBottom();

    }


    /*
      ==========================================
      ADD AI MESSAGE
      ==========================================
    */

function addAssistantMessage(text = "") {
  const row = document.createElement("div");
  row.className = "message-row";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "Z";

  const message = document.createElement("div");
  message.className = "message assistant-message";
  message.textContent = text;

  row.appendChild(avatar);
  row.appendChild(message);
  messages.appendChild(row);

  scrollToBottom();

  // Return the bubble so streaming can update it.
  return message;
}

    /*
      ==========================================
      TYPING INDICATOR
      ==========================================
    */

    function showTyping() {

      const row =
        document.createElement("div");

      row.className =
        "message-row";

      row.id =
        "typingIndicator";


      const avatar =
        document.createElement("div");

      avatar.className =
        "avatar";

      avatar.textContent =
        "Z";


      const typing =
        document.createElement("div");

      typing.className =
        "typing";

      typing.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
      `;


      row.appendChild(avatar);

      row.appendChild(typing);

      messages.appendChild(row);

      scrollToBottom();

    }


    /*
      ==========================================
      REMOVE TYPING INDICATOR
      ==========================================
    */

    function removeTyping() {

      const typing =
        document.getElementById(
          "typingIndicator"
        );

      if (typing) {
        typing.remove();
      }

    }


    /*
      ==========================================
      SCROLL
      ==========================================
    */

    function scrollToBottom() {

      setTimeout(() => {

        chatArea.scrollTop =
          chatArea.scrollHeight;

      }, 50);

    }


    /*
      ==========================================
      SEND MESSAGE TO BACKEND
      ==========================================
    */

   
async function sendMessage() {
  const text = input.value.trim();

  if (!text || loading) {
    return;
  }

  loading = true;
  sendBtn.disabled = true;
  input.value = "";

  welcome.style.display = "none";
  addUserMessage(text);
  showTyping();

  let assistantBubble = null;

  try {
    const response = await fetch(CHAT_API, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain",
      },
      body: text,
    });

    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(
        `Server returned ${response.status}: ${errorText}`
      );
    }

    if (!response.body) {
      throw new Error("Streaming response body is unavailable");
    }

    // Remove the typing dots as soon as the stream starts.
    removeTyping();

    // Create one empty assistant message.
    assistantBubble = addAssistantMessage("");

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { value, done } = await reader.read();

      if (done) {
        break;
      }

      // Decode each incoming byte chunk into text.
      const chunk = decoder.decode(value, {
        stream: true,
      });

      // Append text to the existing message bubble.
      assistantBubble.textContent += chunk;

      scrollToBottom();
    }

    // Flush any remaining bytes from the decoder.
    assistantBubble.textContent += decoder.decode();
    scrollToBottom();

    if (!assistantBubble.textContent.trim()) {
      assistantBubble.textContent =
        "I couldn't generate a response. Please try again.";
    }
  } catch (error) {
    console.error("Chat streaming error:", error);

    removeTyping();

    // Keep any partial answer already received.
    // Show an error separately if the request failed.
    addAssistantMessage(
      assistantBubble
        ? "The response was interrupted. Please try again."
        : "Sorry, I'm unable to connect to the server. Please check that the backend is running on port 8081."
    );
  } finally {
    loading = false;
    sendBtn.disabled = !input.value.trim();
    input.focus();
  }
}


     


    /*
      ==========================================
      CLEAR CHAT
      ==========================================
    */

    clearBtn.addEventListener(
      "click",
      async () => {

        try {

          await fetch(
            CLEAR_API,
            {
              method: "DELETE"
            }
          );

          messages.innerHTML = "";

          welcome.style.display =
            "flex";

          input.focus();

        }

        catch (error) {

          console.error(
            "Unable to clear chat:",
            error
          );

        }

      }
    );

  </script>

</body>
</html>
